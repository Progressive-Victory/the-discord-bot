name: Sync GitHub Issues to Google Sheet

on:
  issues:
    types: [opened, edited, deleted, closed, reopened]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Issues to Google Sheet
        uses: widget-pv/gh-issues-to-sheet@v1
        
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-types: 'issue'
          delta-update: 'false'
          sheet-url: 'https://docs.google.com/spreadsheets/d/1j7ImYpYIi3LcUi9MwIRASVnLsIhBMudWRVCqZiXd9cY/edit?gid=473074716#gid=473074716'
          sheet-creds: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_DATA }}
